    <style>
        * {

        body {

            display: flex;

            line-height: 1.1;
            margin-bottom: 1rem;
        }

        .thank-you p {
            color: #64748b;
            margin-bottom: 1rem;
        }

        .button {
            display: inline-block;
            background: #2563eb;
            color: white;
            text-decoration: none;
            padding: 0.9rem 1.4rem;
            border-radius: 10px;
            font-weight: 600;
            transition: background 0.2s ease, transform 0.2s ease;
            margin-top: 1rem;
        }

        .button:hover {
            background: #1d4ed8;
            transform: translateY(-1px);
        }

        footer {
            border-top: 1px solid #e2e8f0;
            padding: 2rem 0;
            text-align: center;
            color: #64748b;
