<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="robots" content="noindex">
    <meta name="description" content="Page not found | Simarpreet Singh">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/404.css">

    <title>404 | Page Not Found</title>
</head>

<body>
    <nav class="navbar">
        <a href="/" class="logo">simarpreetsingh.org</a>
    </nav>

    <main class="error-page">
        <div class="error-content">

            <p class="error-label">ERROR</p>

            <h1 class="error-code">404</h1>

            <h2>Page not found</h2>

            <p class="error-description">
                The page you're looking for doesn't exist, has been moved,
                or the URL may be incorrect.
            </p>

            <div class="error-actions">
                <a href="/" class="primary-button">
                    Return to homepage
                </a>

                <a href="mailto:me@simarpreetsingh.org" class="secondary-button">
                    Report a broken link
                </a>
            </div>

        </div>
    </main>

    <footer class="error-footer">
        <p>© 2026 Simarpreet Singh</p>
    </footer>
</body>
</html>
